<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebLaptop</title>
<style>
:root{--bg1:#4f8cff;--bg2:#9b5cff;--win:#fff;--tx:#1c1e24;--bar:rgba(255,255,255,.78);--bd:#d9dce3;--ac:#3b6cf6;--mut:#eef0f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--win:#23262e;--tx:#eceef3;--bar:rgba(25,27,33,.8);--bd:#3a3e49;--mut:#2f333d;color-scheme:dark}}
:root[data-theme="dark"]{--win:#23262e;--tx:#eceef3;--bar:rgba(25,27,33,.8);--bd:#3a3e49;--mut:#2f333d;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:relative;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2));user-select:none}
#desk{position:absolute;inset:0 0 46px 0}
.ico{position:absolute;left:14px;width:84px;text-align:center;color:#fff;font-size:12px;cursor:pointer;padding:6px;border-radius:10px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.ico:hover,.ico:focus{background:rgba(255,255,255,.2);outline:none}
.ico b{display:block;font-size:34px;font-weight:400;margin-bottom:2px}
.win{position:absolute;background:var(--win);border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;min-width:260px}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--mut);cursor:move;touch-action:none;font-size:13px;font-weight:600}
.tb span{flex:1}
.tb button{width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--tx);cursor:pointer;font-size:14px}
.tb button:hover{background:var(--bd)}
.tb .x:hover{background:#e5484d;color:#fff}
.body{flex:1;overflow:auto;padding:12px;user-select:text}
#bar{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--bar);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:9999}
#bar button{border:0;background:transparent;color:var(--tx);height:34px;padding:0 12px;border-radius:8px;cursor:pointer;font-size:13px}
#bar button:hover,#bar button.on{background:var(--mut)}
#start{font-weight:700;background:var(--ac)!important;color:#fff!important}
#tasks{flex:1;display:flex;gap:4px;overflow-x:auto}
#clock{font-size:12px;text-align:right;padding:0 8px;line-height:1.25}
#menu{position:absolute;left:8px;bottom:54px;width:300px;background:var(--bar);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:12px;padding:8px;z-index:9999;display:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#menu button{border:0;background:transparent;color:var(--tx);cursor:pointer;border-radius:8px;font-family:inherit}
#menu button:hover{background:var(--mut)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-height:300px;overflow-y:auto}
.mg button{padding:8px 2px;font-size:11px;text-align:center}
.mg button b{display:block;font-size:26px;font-weight:400}
#menu .mo{display:block;width:100%;text-align:left;margin-top:8px;padding:8px;font-size:12px;border-top:1px solid var(--bd);border-radius:0 0 8px 8px}
#menu input::placeholder{color:inherit;opacity:.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button,.btn{border:1px solid var(--bd);background:var(--mut);color:var(--tx);border-radius:8px;padding:12px 0;font-size:16px;cursor:pointer}
.grid button:active,.btn:active{filter:brightness(.9)}
.grid .op{background:var(--ac);color:#fff;border-color:var(--ac)}
.disp{background:var(--mut);border-radius:8px;padding:10px;text-align:right;font-size:26px;min-height:54px;margin-bottom:8px;overflow:hidden;word-break:break-all}
textarea{width:100%;height:calc(100% - 28px);min-height:160px;resize:none;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--win);color:var(--tx);font:14px/1.5 system-ui}
.big{font-size:42px;font-weight:700;text-align:center;margin:6px 0}
.sm{font-size:12px;opacity:.7;text-align:center}
.btn{padding:8px 14px;font-size:13px;margin:4px 4px 0 0}
.sw{display:inline-block;width:44px;height:30px;border-radius:8px;border:2px solid var(--bd);cursor:pointer;margin:4px 6px 0 0}
h4{margin:10px 0 4px}
/* tema keren */
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.45) transparent}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(12px)}to{opacity:1;transform:none}}
body::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(650px 420px at 15% 15%,rgba(255,255,255,.28),transparent 70%),radial-gradient(560px 560px at 90% 85%,rgba(0,0,0,.28),transparent 70%)}
#desk{inset:0 0 64px 0}
.ico{width:88px}
.ico b{width:54px;height:54px;line-height:54px;margin:0 auto 4px;border-radius:16px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:27px;transition:transform .15s}
.ico:hover b,.ico:focus b{transform:translateY(-3px) scale(1.07)}
.ico:hover,.ico:focus{background:transparent}
.win{background:var(--win);background:color-mix(in srgb,var(--win) 86%,transparent);backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.4);border-radius:16px;box-shadow:0 28px 70px rgba(0,0,0,.38),0 2px 6px rgba(0,0,0,.2);animation:pop .22s cubic-bezier(.2,.9,.3,1.15)}
.win.max{border-radius:0}
.tb{padding:10px 12px;gap:8px;background:color-mix(in srgb,var(--mut) 65%,transparent);border-bottom:1px solid color-mix(in srgb,var(--bd) 55%,transparent)}
.tb span{text-align:center;font-weight:600;letter-spacing:.2px}
.tb::after{content:'';width:55px}
.tb .x{order:-3}.tb .m{order:-2}.tb .mx{order:-1}
.tb .m,.tb .mx,.tb .x{width:13px;height:13px;border-radius:50%;font-size:9px;line-height:13px;padding:0;color:transparent;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.tb .x{background:#ff5f57}.tb .m{background:#febc2e}.tb .mx{background:#28c840}
.tb:hover .m,.tb:hover .mx,.tb:hover .x{color:rgba(0,0,0,.65)}
.tb .x:hover{background:#ff5f57;color:rgba(0,0,0,.85)}.tb .m:hover{background:#febc2e}.tb .mx:hover{background:#28c840}
#bar{left:8px;right:8px;bottom:8px;height:50px;border-radius:20px;border:1px solid rgba(255,255,255,.4);box-shadow:0 12px 32px rgba(0,0,0,.3);backdrop-filter:blur(24px) saturate(1.5)}
#bar button{border-radius:12px;transition:background .15s}
#bar button.on{background:var(--mut);box-shadow:inset 0 -3px 0 var(--ac)}
#start{background:linear-gradient(135deg,var(--ac),#a35cff)!important;box-shadow:0 4px 14px rgba(110,90,255,.45);font-weight:700}
#menu{left:12px;bottom:70px;border-radius:22px;padding:12px;border:1px solid rgba(255,255,255,.4);box-shadow:0 24px 60px rgba(0,0,0,.42);backdrop-filter:blur(26px) saturate(1.5);animation:pop .18s ease}
#menu .mg button{border-radius:14px;transition:transform .12s,background .15s}
#menu .mg button:hover{transform:translateY(-2px)}
.mg button b{filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.btn,.grid button{border-radius:12px;background:linear-gradient(180deg,var(--win),var(--mut));box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .1s,filter .15s,box-shadow .15s}
.btn:hover,.grid button:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.18)}
.grid .op{background:linear-gradient(135deg,var(--ac),#7a5cff);border-color:transparent}
.disp{background:linear-gradient(135deg,#171b27,#2d3550);color:#fff;border-radius:16px;font-size:34px;font-weight:300;padding:14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
input:not([type=range]):not([type=color]):not([type=checkbox]),textarea,select{transition:box-shadow .15s}
input:not([type=range]):not([type=color]):not([type=checkbox]):focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 28%,transparent)}
.big{background:linear-gradient(135deg,var(--ac),#c05cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sw{width:38px;height:38px;border-radius:50%;transition:transform .15s;box-shadow:0 3px 8px rgba(0,0,0,.25)}.sw:hover{transform:scale(1.15)}
.ed img{max-width:100%;height:auto;border-radius:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;family=Open+Sans:wght@400;700&amp;family=Lato:wght@400;700&amp;family=Montserrat:wght@400;700&amp;family=Poppins:wght@400;700&amp;family=Inter:wght@400;700&amp;family=Nunito:wght@400;700&amp;family=Raleway:wght@400;700&amp;family=Quicksand:wght@400;700&amp;family=Oswald:wght@400;700&amp;family=Playfair+Display:wght@400;700&amp;family=Merriweather:wght@400;700&amp;family=Lora:wght@400;700&amp;family=Roboto+Mono&amp;family=Source+Code+Pro&amp;family=Pacifico&amp;family=Dancing+Script&amp;family=Caveat&amp;family=Lobster&amp;family=Bebas+Neue&amp;family=Abril+Fatface&amp;family=Comfortaa&amp;family=Righteous&amp;family=Permanent+Marker&amp;display=swap">

<body>
<div id="desk"></div>
<div id="menu"></div>
<div id="bar"><button id="start">⊞ Mulai</button><div id="tasks"></div><div id="clock"></div></div>
<script>
var $=function(s){return document.querySelector(s)};
var desk=$('#desk'),tasks=$('#tasks'),menu=$('#menu'),z=10,wins={};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:99999;font-size:13px';desk.appendChild(t);setTimeout(function(){t.remove()},2400)}
async function dl(n,d){try{var D=window.claude?await claude.use('downloads'):null;if(!D){toast('Unduh tidak tersedia di tampilan ini');return}await D.save({filename:n,data:d})}catch(e){if(!e||e.code!=='declined')toast('Gagal mengunduh')}}
var FONTS=['Arial','Georgia','Times New Roman','Courier New','Verdana','Trebuchet MS','Comic Sans MS','Roboto','Open Sans','Lato','Montserrat','Poppins','Inter','Nunito','Raleway','Quicksand','Oswald','Playfair Display','Merriweather','Lora','Roboto Mono','Source Code Pro','Pacifico','Dancing Script','Caveat','Lobster','Bebas Neue','Abril Fatface','Comfortaa','Righteous','Permanent Marker'];
function fam(n){return "'"+n+"',system-ui,sans-serif"}
function img2url(f,max){return new Promise(function(ok,no){var r=new FileReader();r.onerror=no;r.onload=function(){var im=new Image();im.onerror=no;im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.85))};im.src=r.result};r.readAsDataURL(f)})}
function pick(cb,max){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){var f=i.files[0];if(f)img2url(f,max||800).then(cb,function(){toast('Gambar gagal dibaca')})};i.click()}
var APPS=[
{id:'calc',t:'Kalkulator',i:'🧮',w:280,h:410,r:function(b){
 var ex='',keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','(',')','='];
 b.innerHTML='<div class="disp">0</div><div class="grid"></div>';
 var d=b.querySelector('.disp'),g=b.querySelector('.grid');
 keys.forEach(function(k){var e=document.createElement('button');e.textContent=k;
  if('÷×−+='.indexOf(k)>-1)e.className='op';
  e.onclick=function(){
   if(k==='C')ex='';
   else if(k==='⌫')ex=ex.slice(0,-1);
   else if(k==='='){try{var s=ex.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
     if(!/^[0-9+\-*\/.() ]+$/.test(s))throw 0;var v=Function('"use strict";return ('+s+')')();ex=String(+v.toFixed(8))}catch(x){ex='Error'}}
   else{if(ex==='Error')ex='';ex+=k}
   d.textContent=ex||'0'};g.appendChild(e)});
}},
{id:'note',t:'Catatan',i:'📝',w:380,h:340,r:function(b){
 b.innerHTML='<div class="sm" style="text-align:left;margin-bottom:6px">Tersimpan otomatis · <span id="wc">0 kata</span></div><textarea placeholder="Tulis catatan di sini…"></textarea>';
 var t=b.querySelector('textarea'),w=b.querySelector('#wc');t.value=store('note')||'';
 function u(){var n=t.value.trim()?t.value.trim().split(/\s+/).length:0;w.textContent=n+' kata'}
 u();t.oninput=function(){store('note',t.value);u()};
}},
{id:'clock',t:'Jam',i:'🕒',w:320,h:340,r:function(b){
 b.innerHTML='<div class="big" id="ct"></div><div class="sm" id="cd"></div><h4>Stopwatch</h4><div class="big" id="sw" style="font-size:32px">00:00.0</div><div style="text-align:center"><button class="btn" id="a">Mulai</button><button class="btn" id="r">Reset</button></div>';
 var ms=0,iv=null,st=0;
 function tick(){var n=new Date();b.querySelector('#ct').textContent=n.toLocaleTimeString('id-ID');b.querySelector('#cd').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var t=ms+(iv?Date.now()-st:0),m=Math.floor(t/60000),s=Math.floor(t/1000)%60,x=Math.floor(t/100)%10;
  b.querySelector('#sw').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+x}
 var loop=setInterval(function(){if(!document.body.contains(b)){clearInterval(loop);return}tick()},100);tick();
 b.querySelector('#a').onclick=function(){if(iv){ms+=Date.now()-st;iv=null;this.textContent='Lanjut'}else{st=Date.now();iv=1;this.textContent='Jeda'}};
 b.querySelector('#r').onclick=function(){ms=0;iv=null;b.querySelector('#a').textContent='Mulai'};
}},
{id:'todo',t:'Tugas',i:'✅',w:340,h:380,r:function(b){
 var L=[];try{L=JSON.parse(store('todo')||'[]')}catch(e){}
 b.innerHTML='<div style="display:flex;gap:6px"><input id="in" placeholder="Tugas baru…" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--win);color:var(--tx)"><button class="btn" id="ad" style="margin:0">Tambah</button></div><div id="ls"></div>';
 var ls=b.querySelector('#ls'),inp=b.querySelector('#in');
 function draw(){store('todo',JSON.stringify(L));ls.innerHTML='';
  L.forEach(function(o,i){var r=document.createElement('div');r.style.cssText='display:flex;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--bd)';
   var c=document.createElement('input');c.type='checkbox';c.checked=o.d;c.onchange=function(){o.d=c.checked;draw()};
   var s=document.createElement('span');s.textContent=o.t;s.style.cssText='flex:1;'+(o.d?'text-decoration:line-through;opacity:.5':'');
   var x=document.createElement('button');x.textContent='✕';x.className='btn';x.style.cssText='margin:0;padding:2px 8px';x.onclick=function(){L.splice(i,1);draw()};
   r.append(c,s,x);ls.appendChild(r)})}
 function add(){if(inp.value.trim()){L.push({t:inp.value.trim(),d:false});inp.value='';draw()}}
 b.querySelector('#ad').onclick=add;inp.onkeydown=function(e){if(e.key==='Enter')add()};draw();
}},
{id:'web',t:'Browser',i:'🌐',w:560,h:420,r:function(b){
 b.style.padding='0';b.style.display='flex';b.style.flexDirection='column';
 var T=[{h:[''],i:0}],c=0;
 b.innerHTML='<div class="bt" style="display:flex;gap:4px;padding:6px 6px 0;background:var(--mut);overflow-x:auto"></div><div style="display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--bd)"><button class="btn" data-a="b" style="margin:0;padding:6px 10px">←</button><button class="btn" data-a="f" style="margin:0;padding:6px 10px">→</button><button class="btn" data-a="h" style="margin:0;padding:6px 10px">🏠</button><input class="ad" placeholder="Cari atau ketik alamat" style="flex:1;min-width:0;padding:6px 12px;border-radius:16px;border:1px solid var(--bd);background:var(--win);color:var(--tx)"><button class="btn" data-a="g" style="margin:0;padding:6px 12px">Buka</button></div><div class="pg" style="flex:1;overflow:auto;padding:16px"></div>';
 var bt=b.querySelector('.bt'),ad=b.querySelector('.ad'),pg=b.querySelector('.pg');
 function url(){var t=T[c];return t.h[t.i]}
 function lab(u){if(!u)return 'Tab baru';try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}}
 function go(q){q=q.trim();if(!q)return;var u;
  if(/^https?:\/\//i.test(q))u=q.replace(/^http:/i,'https:');
  else if(/^[^\s]+\.[a-z]{2,}(\/.*)?$/i.test(q))u='https://'+q;
  else u='https://www.google.com/search?q='+encodeURIComponent(q);
  var t=T[c];t.h=t.h.slice(0,t.i+1);t.h.push(u);t.i++;draw();
  try{window.open(u,'_blank','noopener')}catch(e){}}
 function draw(){
  bt.innerHTML='';
  T.forEach(function(t,k){var e=document.createElement('button');e.className='btn';e.style.cssText='margin:0;padding:6px 10px;border-radius:8px 8px 0 0;font-size:12px;white-space:nowrap;'+(k===c?'background:var(--win)':'');
   e.textContent=lab(t.h[t.i]);e.onclick=function(){c=k;draw()};
   if(T.length>1){var x=document.createElement('span');x.textContent='  ✕';x.onclick=function(ev){ev.stopPropagation();T.splice(k,1);c=Math.min(c,T.length-1);draw()};e.appendChild(x)}
   bt.appendChild(e)});
  var p=document.createElement('button');p.className='btn';p.textContent='+';p.style.cssText='margin:0;padding:4px 10px';p.onclick=function(){T.push({h:[''],i:0});c=T.length-1;draw()};bt.appendChild(p);
  var u=url();ad.value=u;pg.innerHTML='';
  if(!u){
   var h=document.createElement('div');h.className='big';h.textContent='🌐 Browser';pg.appendChild(h);
   var s=document.createElement('input');s.placeholder='Cari di Google atau ketik alamat web';s.style.cssText='display:block;width:100%;max-width:420px;margin:10px auto 18px;padding:10px 16px;border-radius:24px;border:1px solid var(--bd);background:var(--win);color:var(--tx);font-size:14px';
   s.onkeydown=function(e){if(e.key==='Enter')go(s.value)};pg.appendChild(s);
   var g=document.createElement('div');g.className='grid';g.style.maxWidth='420px';g.style.margin='0 auto';
   [['Google','https://www.google.com'],['YouTube','https://www.youtube.com'],['Wikipedia','https://id.wikipedia.org'],['GitHub','https://github.com']].forEach(function(z){var e=document.createElement('button');e.textContent=z[0];e.style.cssText='grid-column:span 2;font-size:14px';e.onclick=function(){go(z[1])};g.appendChild(e)});
   pg.appendChild(g)
  }else{
   var d=document.createElement('div');d.style.textAlign='center';
   var a=document.createElement('div');a.className='big';a.style.fontSize='24px';a.textContent=lab(u);d.appendChild(a);
   var m=document.createElement('div');m.className='sm';m.style.wordBreak='break-all';m.textContent=u;d.appendChild(m);
   var l=document.createElement('a');l.className='btn';l.textContent='Buka di tab baru ↗';l.href=u;l.target='_blank';l.rel='noopener noreferrer';l.style.cssText='display:inline-block;margin-top:14px;text-decoration:none;padding:10px 18px;background:var(--ac);color:#fff';d.appendChild(l);
   var n=document.createElement('p');n.className='sm';n.textContent='Situs luar tidak bisa ditampilkan di dalam halaman ini karena batasan keamanan, jadi dibuka di tab browser sungguhan.';d.appendChild(n);
   pg.appendChild(d)}}
 b.querySelectorAll('[data-a]').forEach(function(e){e.onclick=function(){var t=T[c],a=e.dataset.a;
  if(a==='b'&&t.i>0)t.i--;else if(a==='f'&&t.i<t.h.length-1)t.i++;else if(a==='h'){t.h=[''];t.i=0}else if(a==='g'){go(ad.value);return}
  draw()}});
 ad.onkeydown=function(e){if(e.key==='Enter')go(ad.value)};
 draw();
}},
